name: "Publish Release"

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3 python3-pip

      - name: install frontend dependencies
        run: npm install

      - name: Run Tauri build and create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: RivalUI-v__VERSION__
          releaseName: "RivalUI v__VERSION__"
          releaseBody: "Auto build of the Linux app for version __VERSION__"
          releaseDraft: false
          prerelease: false

  release-arch:
    name: Release (Arch Linux Pacman)
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Arch Linux)
        run: |
          pacman -Syu --noconfirm base-devel curl wget git webkit2gtk-4.1 nodejs npm rust python

      - name: Install frontend dependencies
        run: npm install

      - name: Create non-root user for makepkg and build
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          chown -R builder:builder "$GITHUB_WORKSPACE"
          chmod +x ./arch/build-arch.sh

          sudo -u builder ./arch/build-arch.sh

      - name: Upload Arch Package to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: pkg/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
